<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>PagePocket</title>
  <style>
    :root {
      --bg:#FFFFFF; --surface:#F6F8F7; --line:#E9EEEB;
      --ink:#16241D; --ink2:#4F5E57; --ink3:#8A9891;
      --green:#2E9E6B; --green-d:#237A52; --link:#2E9E6B;
      --mint:#E8F5EF; --mint-ink:#1A6B47; --chip:rgba(255,255,255,.6);
      --pdf:#FDEDEC; --pdf-ink:#A13A32; --png:#E9F1FC; --png-ink:#1F5596; --jpg:#FDF3E2; --jpg-ink:#87570C;
      --err:#FDEDEC; --err-ink:#A13A32;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#1E2321; --surface:#272D2A; --line:#333B37;
        --ink:#EEF3F0; --ink2:#B5C1BB; --ink3:#7D8A84; --link:#7FD0A8;
        --mint:#1F3A2D; --mint-ink:#9FDDBF; --chip:rgba(0,0,0,.25);
        --pdf:#3A2422; --pdf-ink:#F2A49C; --png:#1E2C3D; --png-ink:#9CC3F2; --jpg:#3A2F1C; --jpg-ink:#F0C67E;
        --err:#3A2422; --err-ink:#F2A49C;
      }
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { width:320px; background:var(--bg); color:var(--ink); font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
    button:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
    [hidden] { display:none !important; }

    .hero { position:relative; background:var(--mint); padding:16px 16px 14px; overflow:hidden; min-height:96px; }
    .greet { position:relative; z-index:1; font-size:18px; font-weight:800; letter-spacing:-.3px; color:var(--mint-ink); max-width:200px; }
    .sub { position:relative; z-index:1; font-size:12px; color:var(--mint-ink); opacity:.85; margin-top:3px; max-width:190px; line-height:1.4; }
    .chip { position:relative; z-index:1; display:inline-block; margin-top:9px; font-size:11px; font-weight:700; color:var(--mint-ink); background:var(--chip); border-radius:999px; padding:3px 9px; }
    .pal { position:absolute; right:12px; top:12px; width:78px; height:78px; }
    .pal.pop { animation:pop .7s ease-out; }
    .pal.wiggle { animation:wiggle 1.2s ease-in-out infinite; }
    @keyframes pop { 0%{transform:translateY(0)} 35%{transform:translateY(-10px) rotate(-4deg)} 70%{transform:translateY(2px)} 100%{transform:translateY(0)} }
    @keyframes wiggle { 0%,100%{transform:rotate(0)} 50%{transform:rotate(3deg)} }
    .confetti { position:absolute; inset:0; pointer-events:none; }
    .confetti i { position:absolute; top:-10px; width:6px; height:9px; border-radius:2px; animation:fall 2.2s ease-in forwards; }
    @keyframes fall { to { transform:translateY(130px) rotate(340deg); opacity:0; } }
    @media (prefers-reduced-motion: reduce) {
      .confetti { display:none; }
      .pal.pop, .pal.wiggle { animation:none; }
    }

    .body { padding:12px 14px; display:flex; flex-direction:column; gap:12px; }
    .lbl { font-size:11px; font-weight:700; color:var(--ink3); margin-bottom:6px; }
    .seg { display:flex; background:var(--surface); border-radius:10px; padding:3px; }
    .seg button { flex:1; padding:6px 0; border-radius:8px; font-weight:700; font-size:12px; color:var(--ink3); }
    .seg button[aria-pressed="true"] { background:var(--bg); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
    .fmts { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
    .fmt { text-align:left; border-radius:12px; padding:9px 9px 8px; border:2px solid transparent; }
    .fmt b { display:block; font-size:13px; }
    .fmt span { font-size:10.5px; opacity:.85; }
    .f-pdf { background:var(--pdf); color:var(--pdf-ink); }
    .f-png { background:var(--png); color:var(--png-ink); }
    .f-jpg { background:var(--jpg); color:var(--jpg-ink); }
    .fmt[aria-pressed="true"] { border-color:currentColor; }
    .row { display:flex; justify-content:space-between; align-items:center; }
    .row .lbl { margin:0; }
    .pills { display:flex; gap:4px; }
    .pill { padding:4px 10px; border-radius:999px; font-size:11px; font-weight:700; color:var(--ink3); border:1.5px solid var(--line); }
    .pill[aria-pressed="true"] { background:var(--mint); border-color:var(--green); color:var(--mint-ink); }
    .row.off { opacity:.4; }
    .row.off .pill { cursor:not-allowed; }

    .btn { width:100%; background:var(--green); color:#fff; border-radius:12px; padding:12px; font-weight:800; font-size:14px; }
    .btn:hover { background:var(--green-d); }
    .btn:disabled { opacity:.6; cursor:wait; }
    .ghost { display:block; width:100%; text-align:center; font-size:12px; font-weight:700; color:var(--link); margin-top:7px; padding:2px; }
    .ghost.quiet { color:var(--ink3); }

    .prog { height:6px; background:var(--surface); border-radius:6px; overflow:hidden; }
    .prog i { display:block; height:100%; width:0; background:var(--green); border-radius:6px; transition:width .3s ease; }
    .plabel { font-size:12px; color:var(--ink2); text-align:center; margin-top:7px; }
    .note { background:var(--surface); color:var(--ink2); border-radius:12px; padding:10px 12px; font-size:12px; line-height:1.45; }
    .note b { display:block; color:var(--ink); font-size:13px; margin-bottom:2px; }
    .note.good { background:var(--mint); color:var(--mint-ink); }
    .note.good b { color:var(--mint-ink); }
    .note.bad { background:var(--err); color:var(--err-ink); }
    .note.bad b { color:var(--err-ink); }
    .fname { word-break:break-all; }

    .recent { border-top:1px solid var(--line); padding-top:10px; }
    .item { display:flex; align-items:center; gap:9px; padding:5px 0; }
    .tag { font-size:9.5px; font-weight:800; border-radius:6px; padding:3px 5px; min-width:36px; text-align:center; }
    .name { flex:1; font-size:12px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .show { font-size:11px; font-weight:700; color:var(--link); }
    .gone { font-size:11px; color:var(--ink3); }
    .empty { font-size:12px; color:var(--ink3); }
    .hint { font-size:11px; color:var(--ink3); text-align:center; padding:2px 0 4px; }
    kbd { font:inherit; font-weight:700; background:var(--surface); border:1px solid var(--line); border-radius:5px; padding:0 4px; color:var(--ink2); }
  </style>
</head>
<body>
  <header class="hero" id="hero">
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="greet" id="greet">Hello!</div>
    <div class="sub" id="sub">Ready to pocket something?</div>
    <div class="chip" id="chip">0 pages pocketed</div>
    <div id="palWrap" aria-hidden="true"></div>
  </header>

  <main class="body">
    <!-- Ready -->
    <section id="readyView">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div>
          <div class="lbl" id="modeLbl">What to pocket</div>
          <div class="seg" role="group" aria-labelledby="modeLbl" id="modeGroup">
            <button data-value="full">Full page</button>
            <button data-value="visible">Visible area</button>
          </div>
        </div>
        <div>
          <div class="lbl" id="fmtLbl">Save as</div>
          <div class="fmts" role="group" aria-labelledby="fmtLbl" id="formatGroup">
            <button class="fmt f-pdf" data-value="pdf"><b>PDF</b><span>To share or print</span></button>
            <button class="fmt f-png" data-value="png"><b>PNG</b><span>Sharpest image</span></button>
            <button class="fmt f-jpg" data-value="jpeg"><b>JPEG</b><span>Smaller file</span></button>
          </div>
        </div>
        <div class="row" id="methodRow">
          <div class="lbl" id="methodLbl">Method</div>
          <div class="pills" role="group" aria-labelledby="methodLbl" id="methodGroup">
            <button class="pill" data-value="dom" title="Redraws the page. Fast, but some sites look odd.">Quick render</button>
            <button class="pill" data-value="scroll" title="Scrolls and screenshots. Most accurate.">Scroll &amp; stitch</button>
          </div>
        </div>
        <div class="row" id="qualityRow">
          <div class="lbl" id="qualityLbl">Quality</div>
          <div class="pills" role="group" aria-labelledby="qualityLbl" id="qualityGroup">
            <button class="pill" data-value="0.6">Low</button>
            <button class="pill" data-value="0.85">Med</button>
            <button class="pill" data-value="0.95">High</button>
          </div>
        </div>
        <div>
          <button class="btn" id="pocketBtn">Pocket this page</button>
          <button class="ghost" id="copyBtn">Copy to clipboard instead</button>
        </div>
      </div>
    </section>

    <!-- Capturing -->
    <section id="busyView" hidden>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div>
          <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progWrap"><i id="progBar"></i></div>
          <div class="plabel" id="progLabel" aria-live="polite">Getting ready...</div>
        </div>
        <div class="note" id="busyNote"><b>You can close this popup</b>I'll keep going in the background. Just stay on this tab.</div>
        <button class="ghost quiet" id="cancelBtn">Cancel</button>
      </div>
    </section>

    <!-- Done -->
    <section id="doneView" hidden>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="note good" id="doneNote" aria-live="polite"></div>
        <button class="btn" id="againBtn">Pocket another page</button>
      </div>
    </section>

    <!-- Error -->
    <section id="errorView" hidden>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="note bad" id="errorNote" role="alert"></div>
        <button class="btn" id="retryBtn">Try again</button>
      </div>
    </section>

    <section class="recent" id="recentView">
      <div class="lbl">Recent pockets</div>
      <div id="recentList"></div>
    </section>

    <div class="hint" id="hint"></div>
  </main>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
